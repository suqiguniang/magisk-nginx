# ===========================================================================
# Nginx for Android — 主配置
#
# 运行方式(由模块脚本完成)：
#     nginx -p /data/adb/nginx -c /data/adb/nginx/conf/nginx.conf
# 因此下方所有相对路径都相对前缀 /data/adb/nginx 解析：
#   logs/      -> /data/adb/nginx/logs/
#   html/      -> /data/adb/nginx/html/
#   conf/...   -> /data/adb/nginx/conf/...
# ===========================================================================

worker_processes  1;

# 以 root 运行(module 脚本在 root 域执行)，不指定 user
# error_log 记录到运行目录下的 logs/
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  512;
    use epoll;
}

http {
    # mime.types 与本文件同在 conf/ 目录下
    include       conf/mime.types;
    default_type  application/octet-stream;

    access_log  logs/access.log;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    client_max_body_size 50m;

    # gzip 压缩(对文本类响应生效)
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   4;
    gzip_types        text/plain text/css application/javascript application/json
                      text/xml application/xml application/xml+rss image/svg+xml;

    # 每个站点/反代 server 块放在 conf/conf.d/ 下，通配 include(可放多个)
    include           conf/conf.d/*.conf;
}
