# ===========================================================================
# Nginx for Android — 主配置
#
# 由模块脚本以「非 root 用户」(默认 uid/gid 2000 = shell)启动：
#     setuidgid 2000:2000 nginx -p /data/nginx -c /data/nginx/conf/nginx.conf
#
# 两个必须注意的点：
# 1. 不要写 user 指令。本二进制是静态 glibc 构建，getpwnam() 不可用；以 root
#    运行(会触发用户解析)必然 [emerg] 失败，非 root 运行时 user 指令也会被忽略。
# 2. 文件路径全部用绝对路径。nginx 里"相对路径"解析规则不统一(error_log/pid 相对
#    -p 前缀，include 相对配置文件所在目录)，绝对路径可避免歧义。
# ===========================================================================

worker_processes  1;

error_log  /data/nginx/logs/error.log warn;
pid        /data/nginx/logs/nginx.pid;

events {
    worker_connections  512;
    use epoll;
}

http {
    # mime.types 与本文件同在 conf/ 目录下
    include       /data/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log  /data/nginx/logs/access.log;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    client_max_body_size 50m;

    # gzip 压缩(对文本类响应生效)
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   4;
    gzip_types        text/plain text/css application/javascript application/json
                      text/xml application/xml application/xml+rss image/svg+xml;

    # 每个站点/反代 server 块放在 conf.d/ 下，通配 include(可放多个)
    include           /data/nginx/conf/conf.d/*.conf;
}
