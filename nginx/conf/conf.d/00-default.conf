# 默认站点：监听 8080，服务状态页 + 静态文件。
# 浏览器访问 http://<手机IP>:8080 可见。
# 所有路径用绝对路径(前缀 /data/nginx)，避免相对路径解析歧义。
# 想监听 80 端口：见 README「监听 80/443 低端口」一节。

server {
    listen        8080;
    # listen        [::]:8080;   # 如设备支持 IPv6 可取消注释
    server_name   _;
    root          /data/nginx/html;
    index         index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Nginx 运行状态页(需要二进制带 --with-http_stub_status_module，本模块已内置)
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        deny all;
    }

    # 反向代理示例见同目录 reverse-proxy.conf.example
}
