<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nginx for Android</title>
<style>
  :root { --bg:#10131c; --card:#181d2b; --fg:#e7ecf5; --mut:#8b93a7; --ok:#2ecc71; --acc:#4ea1ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6fb; --card:#ffffff; --fg:#1c2233; --mut:#5a6377; --acc:#2f7fe0; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif; padding:24px; }
  .card { background:var(--card); border:1px solid rgba(128,128,160,.18);
    border-radius:18px; padding:34px 30px; max-width:520px; width:100%; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.35); }
  .badge { font-size:13px; letter-spacing:.06em; color:var(--acc); font-weight:600; }
  h1 { margin:10px 0 4px; font-size:30px; font-weight:700; }
  .sub { color:var(--mut); font-size:14px; margin:0 0 22px; }
  .row { display:flex; justify-content:space-between; gap:12px; text-align:left;
    background:rgba(128,128,160,.08); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:14px; }
  .row b { color:var(--mut); font-weight:500; }
  .ok { color:var(--ok); font-weight:600; }
  .hint { color:var(--mut); font-size:12.5px; margin-top:18px; line-height:1.7; }
  code { background:rgba(128,128,160,.15); border-radius:6px; padding:1px 6px; font-size:12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Nginx for Android · Magisk Module</div>
    <h1>运行正常</h1>
    <p class="sub">Nginx 1.21.6 (arm64 静态) 已就绪</p>

    <div class="row"><b>HTTP 默认站点</b><span class="ok">:8080</span></div>
    <div class="row"><b>状态页</b><span><a href="/nginx_status" style="color:var(--acc)">/nginx_status</a></span></div>
    <div class="row"><b>反代示例</b><span>conf.d/</span></div>

    <p class="hint">
      反向代理配置见 <code>/data/adb/nginx/conf/conf.d/reverse-proxy.conf.example</code>。<br>
      在「执行」菜单可用音量键 启动 / 停止 / 重启。
    </p>
  </div>
</body>
</html>
